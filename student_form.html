 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset ="UTF-8">
    <meta name="viewport"content="width=\,initial-scale=1.0">
    <title>Document</title>

    </head>
    <body>
        <h1>Student registration portal</h1>
     <form action="/register" method="post">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your FullName">
           <br>
           <br>
        <label for="email">Email:</label>
       <input type="email" id="email" name="email" placeholder="Enter your Email" required>
       <br>
       <br>
       <label for="age">Age:</label>
       <input type="number" id="age" name="age" placeholder="Enter your Age">
       <br>
       <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="Enter your dob">
        <br>
        <label for="gender">gender:</label>
        <input type ="radio" value="female" name="gender" id="female">
        <label for="female">female</label>

        <input type="radio" value="male" name="gender" id="male">
        <label for="male">Male</label>


        <br>
        <br>

        <label for="skills">Skills:</label>

        <input type="checkbox" id="skills" name="skills" value="programming">
        <label for="skills">Programming</label>

        <input type="checkbox" id="skills2" name="skills" value="design">
        <label for="skills2">Design</label>

    
        <br>

        <button type="submit">submit</button>
        
     </form>
    </body>
</html>
