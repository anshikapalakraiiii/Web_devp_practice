<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            background-color: rgb(104, 104, 97);
            display: flex;
            justify-content: center;
            align-items: center;
            height : 600px;
            gap: 30px;
        }

        .box {
            width: 150px;
            height: 150px;
            background-color: rgb(102, 107, 184);

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>

    </div>

</body>
</html>
