  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Portal</title>

    <style>
        body{
            background-color: hsl(120, 20%, 99%);
            text-align: center;
            font-family: Arial, sans-serif;
        }

        form{
            width: 400px;
            min-height: 700px;
            border: 1px solid #0e0808;
            border-radius: 10px;
            margin: 30px auto;
            padding: 20px;
            text-align: left;
            box-sizing: border-box;
            background-color: white;
        }

        h1{
            text-align: center;
        }

        label{
            font-weight: bold;
        }

        input, select, textarea{
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea{
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        input[type="radio"],
        input[type="checkbox"]{
            width: auto;
        }

        iframe{
            width: 100%;
            height: 220px;
            border-radius: 8px;
        }

        .button-group{
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .button-group button{
            width: 45%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn{
            background-color: rgb(41, 41, 103);
        }

        .register-btn{
            background-color: rgb(14, 17, 20);
        }

        .submit-btn:hover{
            background-color: darkblue;
        }

        .register-btn:hover{
            background-color: rgb(2, 8, 2);
        }
    </style>
</head>

<body>

    <h1>Internship Portal</h1>

    <form action="/apply" method="post" enctype="multipart/form-data">

        <label for="fullName">Full Name:</label><br>
        <input type="text" id="fullName" name="fullName"
               placeholder="Enter your Full Name" required>
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"
               placeholder="Enter your Email" required>
        <br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your Phone Number">
        <br><br>

        <label for="university">University:</label><br>
        <input type="text" id="university" name="university"
               placeholder="Enter your University">
        <br><br>

        <label>Gender:</label><br>

        <input type="radio" value="male" name="gender" id="male">
        <label for="male">Male</label>

        <input type="radio" value="female" name="gender" id="female">
        <label for="female">Female</label>

        <input type="radio" value="other" name="gender" id="other">
        <label for="other">Other</label>

        <br><br>

        <label for="course">Course Select:</label><br>

        <select id="course" name="course">
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
        </select>

        <br><br>

        <label>Skills:</label><br>

        <input type="checkbox" id="skills1" name="skills" value="java">
        <label for="skills1">Java</label>

        <input type="checkbox" id="skills2" name="skills" value="javascript">
        <label for="skills2">JavaScript</label>

        <input type="checkbox" id="skills3" name="skills" value="HTML">
        <label for="skills3">HTML</label>

        <input type="checkbox" id="skills4" name="skills" value="CSS">
        <label for="skills4">CSS</label>

        <input type="checkbox" id="skills5" name="skills" value="React">
        <label for="skills5">React</label>

        <br><br>

        <label>Internship Preference:</label><br><br>

        <label>
            <input type="radio" name="internship" value="software">
            Software Engineering
        </label><br>

        <label>
            <input type="radio" name="internship" value="marketing">
            Digital Marketing
        </label><br>

        <label>
            <input type="radio" name="internship" value="data">
            Data Science
        </label>

        <br><br>

        <label for="resume">Upload Resume (PDF, DOCX):</label><br>
        <input type="file" id="resume" name="resume"
               accept=".pdf,.docx" required>

        <br><br>

        <label for="coverLetter">Cover Letter:</label><br>
        <textarea id="coverLetter" name="coverLetter"
                  rows="10"
                  placeholder="Write your cover letter here..."
                  required></textarea>

        <br><br>

        <iframe
            src="https://www.youtube.com/embed/HBqWsrqK89U?controls=0"
            title="YouTube video player"
            frameborder="0"
            allowfullscreen>
        </iframe>

        <br><br>

        <!-- Side by Side Buttons -->
        <div class="button-group">
            <button type="submit" class="submit-btn">Submit</button>
            <button type="button" class="register-btn">Register</button>
        </div>

    </form>

</body>
</html>
