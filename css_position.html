<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
,<style>
    .box{
        background-color: rgb(142, 209, 209);
        height: 200px;
        width: 200px;
        margin: 30px;
        position: relative;

    }
    /*.parent{
        position: relative;
    }
        */
    #box-1{
        position: sticky;
        top :0;
        background-color: brown;
        z-index: 1;

    }
    #box-2{
        position: relative;
        right: 0px;
    }
    #box-3{
        position: absolute;
        top :50;
    }
    #box-4{
        position: fixed;
  
    }
    </style>
<head>
<body>
    <div class="parent">
        <div id="box">  I an static</div>
        <div id="box-2" class="box">I am relative</div>
        <div id="box-3" class="box">I am absolute</div> 
        <div id="box-4" class="box">I am fixed</div>
        <div class="box">I am normal box</div>
        <div class="box">I am normal box</div>
    </body></div>

    
</body>
</html>
